# Main nginx config — mounted read-only at /etc/nginx/nginx.conf so the whole
# proxy is controllable from one file in the repo. The per-domain server blocks
# live in conf.d/*.conf (rendered from docker/nginx/templates/*.template, where
# ${DOMAIN} is substituted at container start).
#
# "What is proxied and why" is centralized here in the `upstream` blocks and the
# shared proxy headers; "which path goes where" is in 10-https.conf.template.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # ----------------------------------------------------------------------
    # Proxy targets — WHAT is proxied and WHY. Edit here to add/repoint a
    # backend; the server blocks reference these names via proxy_pass.
    # ----------------------------------------------------------------------

    # Telegram bot (aiogram webhook server). Only /webhook (Telegram updates)
    # and /health (liveness) are routed here — see 10-https.conf.template.
    upstream bot_backend {
        server bot:8000;
    }

    # Web dashboard (FastAPI, Telegram-login settings UI). Catch-all: every
    # request that isn't a bot path is proxied here.
    upstream dashboard_backend {
        server dashboard:8080;
    }

    # Shared upstream headers so backends see the real client IP and scheme.
    # Applied to every proxied request (do NOT re-declare proxy_set_header in a
    # location, or these get dropped for that location).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Per-domain server blocks (rendered from templates with ${DOMAIN}).
    include /etc/nginx/conf.d/*.conf;
}
