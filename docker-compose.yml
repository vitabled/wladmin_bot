services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-telegram_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-telegram_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Enable AOF persistence so FSM/captcha/counters survive restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: 8000
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/webhook}
      OWNER_ID: ${OWNER_ID}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-telegram_bot}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-logs/app.log}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-ru}
    ports:
      - "${WEBHOOK_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Web dashboard (Phase 7) — Telegram-login settings UI, shares DB/Redis.
  dashboard:
    build: .
    command: ["python", "-m", "bot.web"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      OWNER_ID: ${OWNER_ID}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-telegram_bot}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
      WEB_BOT_USERNAME: ${WEB_BOT_USERNAME:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
      # LOCAL ONLY: set to 1 to enable /dev-login (no Telegram/domain needed).
      WEB_DEV_LOGIN: ${WEB_DEV_LOGIN:-0}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot: generate a self-signed cert if none exists (local bring-up).
  # For production, drop real certs into the nginx_certs volume (or run certbot).
  nginx-init:
    image: alpine:3.20
    volumes:
      - nginx_certs:/certs
    command:
      - sh
      - -c
      - >
        test -f /certs/fullchain.pem ||
        { apk add --no-cache openssl >/dev/null &&
          openssl req -x509 -nodes -newkey rsa:2048 -days 365
          -keyout /certs/privkey.pem -out /certs/fullchain.pem
          -subj '/CN=localhost'; }

  # Reverse proxy: :80 (ACME + redirect) and :443 (TLS) → bot webhook + dashboard.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN:-bot.localhost}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-panel.localhost}
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - nginx_certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot
    depends_on:
      nginx-init:
        condition: service_completed_successfully
      bot:
        condition: service_started
      dashboard:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  nginx_certs:
  certbot_www:
